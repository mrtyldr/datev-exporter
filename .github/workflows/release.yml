# Publishes the BOM and all five library artifacts when a non-prerelease GitHub Release with a
# tag of exactly vX.Y.Z is published. Maven Central releases are immutable, so verify the tag and
# the environment approval before running this.
#
# Requires a protected `maven-central` environment holding these secrets:
#   MAVEN_CENTRAL_USERNAME  Central Publisher Portal token username
#   MAVEN_CENTRAL_PASSWORD  Central Publisher Portal token password
#   SIGNING_KEY             ASCII-armored private PGP key
#   SIGNING_KEY_PASSWORD    Private-key password
#
# No credentials belong in a tracked gradle.properties file.
name: Publish to Maven Central

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment: maven-central

    steps:
      - name: Check out released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use the form vX.Y.Z; got: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Build and run deterministic tests
        run: ./gradlew --no-daemon clean check -PreleaseVersion="$RELEASE_VERSION"

      - name: Verify against pinned official DATEV checker schema
        run: ./gradlew --no-daemon datevCheckerTest -PreleaseVersion="$RELEASE_VERSION"

      - name: Publish and release on Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon \
            :publishAndReleaseToMavenCentral \
            :datev-exporter-core:publishAndReleaseToMavenCentral \
            :datev-exporter-plain:publishAndReleaseToMavenCentral \
            :datev-exporter-univocity:publishAndReleaseToMavenCentral \
            :datev-exporter-field-validator:publishAndReleaseToMavenCentral \
            :datev-exporter-advanced:publishAndReleaseToMavenCentral \
            -PreleaseVersion="$RELEASE_VERSION"
