name: Documentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'build.gradle'
      - 'buildSrc/**'
      - 'datev-exporter-*/build.gradle'
      - 'datev-exporter-*/src/main/java/**'
      - 'datev-exporter-benchmarks/**'
      - 'gradle/**'
      - 'gradlew'
      - 'scripts/DumpFieldSpecs.java'
      - 'scripts/DumpHeaderRecord.java'
      - 'scripts/assemble-pages.py'
      - 'scripts/generate-reference-pages.py'
      - 'scripts/indexnow-key.txt'
      - 'scripts/submit-indexnow.py'
      - 'website/**'
      - '.github/assets/social-preview.png'
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - 'build.gradle'
      - 'buildSrc/**'
      - 'datev-exporter-*/build.gradle'
      - 'datev-exporter-*/src/main/java/**'
      - 'datev-exporter-benchmarks/**'
      - 'gradle/**'
      - 'gradlew'
      - 'scripts/DumpFieldSpecs.java'
      - 'scripts/DumpHeaderRecord.java'
      - 'scripts/assemble-pages.py'
      - 'scripts/generate-reference-pages.py'
      - 'scripts/indexnow-key.txt'
      - 'scripts/submit-indexnow.py'
      - 'website/**'
      - '.github/assets/social-preview.png'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  # Do not interrupt an in-flight production deployment; a later run remains queued.
  cancel-in-progress: false

env:
  DOCS_VERSION: '0.2.0'
  PYTHONDONTWRITEBYTECODE: '1'
  SITE_URL: 'https://mrtyldr.github.io/datev-exporter/'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Generate public-module Javadocs
        run: ./gradlew --no-daemon siteJavadocs -PreleaseVersion="$DOCS_VERSION"

      # The published field, header and codec tables are generated from the library. Regenerating
      # here fails the build if a schema change lands without refreshing the documentation, so the
      # site cannot silently describe a schema the code no longer implements.
      - name: Verify generated reference pages match the library
        run: |
          mkdir -p build/dump
          javac -d build/dump \
            -cp datev-exporter-core/build/classes/java/main \
            scripts/DumpFieldSpecs.java scripts/DumpHeaderRecord.java
          java -cp build/dump:datev-exporter-core/build/classes/java/main \
            DumpFieldSpecs > build/fields.tsv
          java -cp build/dump:datev-exporter-core/build/classes/java/main \
            DumpHeaderRecord > build/header.tsv
          python3 scripts/generate-reference-pages.py
          # Scoped to the generated files only: an unrelated edit elsewhere in the site must not
          # be reported as schema drift.
          if ! git diff --quiet -- \
              website/en/fields.html website/en/validation-errors.html \
              website/en/extf-header.html website/en/encoding.html \
              website/de/fields.html website/de/validation-errors.html \
              website/de/extf-header.html website/de/encoding.html; then
            echo "::error::Generated reference pages are stale. Run scripts/generate-reference-pages.py and commit the result."
            git diff --stat -- website
            exit 1
          fi

      - name: Assemble and validate current-source site
        run: |
          python3 scripts/assemble-pages.py \
            --version "$DOCS_VERSION" \
            --base-url "$SITE_URL"

      - name: Check out immutable v0.2.0 source for deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The GitHub Release is not immutable. Pin the commit so versioned API docs cannot drift
          # if the tag is ever moved accidentally.
          ref: 06fa7ae238990d579ae3f7f40f64260d421a94fb
          path: build/release-v0.2.0
          persist-credentials: false

      - name: Generate immutable v0.2.0 Javadocs for deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: build/release-v0.2.0
        run: |
          ./gradlew --no-daemon \
            :datev-exporter-core:javadoc \
            :datev-exporter-plain:javadoc \
            :datev-exporter-field-validator:javadoc \
            :datev-exporter-advanced:javadoc \
            :datev-exporter-advanced-univocity:javadoc \
            -PreleaseVersion="$DOCS_VERSION"

      - name: Assemble and validate deployable site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python3 scripts/assemble-pages.py \
            --version "$DOCS_VERSION" \
            --base-url "$SITE_URL" \
            --javadoc-root build/release-v0.2.0

      # Pull requests build and link-check the complete site but never upload a deployable artifact.
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          include-hidden-files: true
          path: build/pages

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  notify-indexnow:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out notification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Search-engine notification is optional and must not roll back an otherwise healthy deploy.
      - name: Notify IndexNow
        continue-on-error: true
        run: python3 scripts/submit-indexnow.py
